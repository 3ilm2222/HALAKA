name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm --version

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create app environment file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Missing required GitHub Secrets: EXPO_PUBLIC_SUPABASE_URL and EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          {
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_KEY"
          } > .env
          echo "Environment variables loaded from GitHub Secrets."

      - name: Verify Expo public configuration
        shell: bash
        run: |
          pnpm exec expo config --type public --json > expo-config.json
          node -e "const c=require('./expo-config.json'); if(!c.extra?.supabaseUrl || !c.extra?.supabasePublishableKey) { throw new Error('Supabase configuration is missing from Expo public config.'); }"
          rm expo-config.json

      - name: Generate Android project
        run: pnpm exec expo prebuild --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle*'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-school-students-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
