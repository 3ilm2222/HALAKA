name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9.12.0'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create app environment file
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_KEY }}
        run: |
          DEFAULT_URL="https://ihofyzhldvuwrhtidjfm.supabase.co"
          DEFAULT_KEY="sb_publishable_Ul7dou1xwKZyoSj_qiqWBg_0dIRG211"

          FINAL_URL="${SUPABASE_URL:-$DEFAULT_URL}"
          FINAL_KEY="${SUPABASE_KEY:-$DEFAULT_KEY}"

          {
            printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n' "$FINAL_URL"
            printf 'EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=%s\n' "$FINAL_KEY"
          } > .env

          if [ -n "$SUPABASE_URL" ]; then
            echo "Using Supabase credentials from GitHub Secrets."
          else
            echo "GitHub Secrets not set; using default verified project Supabase credentials."
          fi

      - name: Verify Expo public configuration
        shell: bash
        run: |
          pnpm exec expo config --type public --json > expo-config.json
          node -e "const c=require('./expo-config.json'); if(!c.extra?.supabaseUrl || !c.extra?.supabasePublishableKey) { throw new Error('Supabase configuration is missing from Expo public config.'); } else { console.log('Expo config validated successfully with URL:', c.extra.supabaseUrl); }"
          rm expo-config.json

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: 'android/**/*.gradle*'

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-school-students-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

